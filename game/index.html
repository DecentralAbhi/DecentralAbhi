<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Squasher | Abhishek Sharma</title>
<style>
  :root { --bg:#0d0221; --card:#1a0b2e; --line:#3a1c71; --ember:#ff6b35; --gold:#ffd166; --text:#f4e9ff; }
  * { box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0,#3a1c71 0,var(--bg) 60%); color:var(--text);
         font-family:'Courier New',monospace; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { color:var(--gold); margin:8px 0 4px; text-shadow:0 0 14px var(--ember); text-align:center; }
  p.sub { margin:0 0 12px; color:#b8a1d9; font-size:14px; text-align:center; }
  .hud { display:flex; gap:12px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; }
  .hud div { background:var(--card); border:1px solid var(--line); padding:6px 14px; border-radius:8px; }
  .hud b { color:var(--ember); }
  #arena { position:relative; width:min(94vw,640px); height:min(62vh,420px); background:var(--card); border:2px solid var(--line);
           border-radius:14px; overflow:hidden; cursor:crosshair; box-shadow:0 0 30px rgba(255,107,53,.25); }
  .t { position:absolute; font-size:34px; cursor:pointer; animation:pop .15s ease-out; }
  @keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
  #msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:rgba(13,2,33,.88); text-align:center; padding:20px; gap:10px; }
  button { background:var(--ember); color:#0d0221; border:0; padding:10px 26px; font:bold 16px 'Courier New',monospace;
           border-radius:8px; cursor:pointer; }
  button:hover { background:var(--gold); }
  small { color:#b8a1d9; }
</style>
</head>
<body>
  <h1>🐛 Bug Squasher</h1>
  <p class="sub">Squash 🐛 bugs (+1) &nbsp;|&nbsp; 🐞 golden bug (+5) &nbsp;|&nbsp; avoid 💥 merge conflicts (-3)</p>
  <div class="hud">
    <div>Score: <b id="score">0</b></div>
    <div>Time: <b id="time">30</b>s</div>
    <div>Best: <b id="best">0</b></div>
  </div>
  <div id="arena">
    <div id="msg">
      <h2 id="title" style="color:var(--gold);margin:0">Ready, Dev?</h2>
      <small id="detail">Squash as many bugs as you can in 30 seconds.</small>
      <button id="start">Start Game</button>
    </div>
  </div>
  <script>
    const arena = document.getElementById('arena'), msg = document.getElementById('msg');
    const $ = id => document.getElementById(id);
    let score = 0, time = 30, timer, spawner, running = false, best = 0;
    try { best = +localStorage.getItem('bugBest') || 0; } catch (e) {}
    $('best').textContent = best;

    function spawn() {
      if (!running) return;
      const r = Math.random();
      const type = r < 0.2 ? { e:'💥', p:-3 } : r < 0.3 ? { e:'🐞', p:5 } : { e:'🐛', p:1 };
      const el = document.createElement('div');
      el.className = 't';
      el.textContent = type.e;
      el.style.left = Math.random() * (arena.clientWidth - 44) + 'px';
      el.style.top = Math.random() * (arena.clientHeight - 44) + 'px';
      const hit = ev => {
        ev.preventDefault();
        if (!running) return;
        score = Math.max(0, score + type.p);
        $('score').textContent = score;
        el.remove();
      };
      el.addEventListener('pointerdown', hit);
      arena.appendChild(el);
      setTimeout(() => el.remove(), Math.max(500, 1200 - (30 - time) * 18));
      spawner = setTimeout(spawn, Math.max(250, 700 - (30 - time) * 14));
    }

    function start() {
      score = 0; time = 30; running = true;
      $('score').textContent = 0; $('time').textContent = 30;
      msg.style.display = 'none';
      arena.querySelectorAll('.t').forEach(n => n.remove());
      spawn();
      timer = setInterval(() => {
        $('time').textContent = --time;
        if (time <= 0) end();
      }, 1000);
    }

    function end() {
      running = false; clearInterval(timer); clearTimeout(spawner);
      arena.querySelectorAll('.t').forEach(n => n.remove());
      const newBest = score > best;
      if (newBest) { best = score; $('best').textContent = best; try { localStorage.setItem('bugBest', best); } catch (e) {} }
      $('title').textContent = newBest ? '🏆 New High Score!' : 'Time\'s Up!';
      $('detail').textContent = 'You squashed ' + score + ' points worth of bugs.';
      $('start').textContent = 'Play Again';
      msg.style.display = 'flex';
    }

    $('start').addEventListener('click', start);
  </script>
</body>
</html>
